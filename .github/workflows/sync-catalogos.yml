# Sincronizacion automatica del catalogo de LUNARIA (pijamas):
# descarga Sublimados Majestic, regenera catalogo.js (tienda) y el Excel
# del proveedor; y publica los cambios.
#
# LUNARIA es un catalogo por repositorio: solo la linea de pijamas (l2).
#
# Requisito (una sola vez): Settings > Actions > General > Workflow permissions
# debe estar en "Read and write permissions" para que el bot pueda hacer push.
name: Sincronizar catalogo

on:
  schedule:
    - cron: "0 */6 * * *" # cada 6 horas (UTC)
  workflow_dispatch: # permite ejecutarlo a mano desde la pestana Actions

permissions:
  contents: write
  issues: write # avisa con un issue si la sincronizacion falla

concurrency:
  group: sync-catalogos
  # Un job que hace PUSH no se cancela a medias: si dos corridas se
  # solapan, la segunda hace cola y termina en "Sin cambios". El
  # timeout-minutes del job evita que una corrida colgada acumule fila.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: el panel publica data/configuracion.js
                           # por API mientras el cron corre; el push seguro lo absorbe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install openpyxl pillow
      - name: Sincronizar catalogo
        run: python scripts/sync_catalogos.py
      # Ultima barrera antes de publicar (plan de auditoria L0): un
      # catalogo.js con sintaxis rota NO sale a produccion (tienda muerta
      # = S2). Node viene preinstalado en el runner.
      - name: Validar catalogo generado
        run: node --check catalogo.js
      - name: Publicar cambios (si los hay)
        run: |
          git config user.name  "tiendalunaria-bot"
          git config user.email "tiendalunaria@users.noreply.github.com"
          git add catalogo.js *.xlsx img
          if ! git diff --cached --quiet; then
            git commit -m "sync: actualiza catalogo de pijamas y Excel del proveedor [skip ci]"
            # Si el panel publico la configuracion mientras este cron corria,
            # el repositorio quedo adelante: se absorbe con rebase (el panel
            # solo toca data/configuracion.js, nunca catalogo.js ni el Excel,
            # asi que no hay conflicto posible) y se reintenta el push.
            if ! git pull --rebase origin "${{ github.ref_name }}"; then
              echo "No se pudo absorber lo publicado por el panel; el catalogo se regenera en la proxima corrida."
              exit 1
            fi
            # Si otro push entra justo entre el rebase y el push, el push
            # sale rechazado: se reabsorbe y se reintenta (3 intentos) en
            # vez de fallar la corrida.
            ok=0
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              echo "Push rechazado (intento $i); reabsorbiendo cambios remotos..."
              git pull --rebase origin "${{ github.ref_name }}" || exit 1
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "No se pudo publicar tras 3 intentos; el catalogo se regenera en la proxima corrida."
              exit 1
            fi
          else
            echo "Sin cambios: el catalogo ya estaba al dia."
          fi

      - name: Abrir o actualizar issue si fallo
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const {data: abiertas} = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'sync-catalogos', per_page: 1});
            const cuerpo = '### 🔴 Sync de catálogo falló\n'
              + 'Corrida: ' + new Date().toISOString() + ' ([log completo]('
              + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo
              + '/actions/runs/' + context.runId + '))\n\n'
              + 'Lo publicado (catalogo.js, Excel, imágenes) NO se tocó: queda la versión anterior '
              + 'hasta que una corrida sana lo reemplace.';
            if (abiertas.length) {
              await github.rest.issues.createComment({...context.repo, issue_number: abiertas[0].number, body: cuerpo});
            } else {
              await github.rest.issues.create({...context.repo, title: '🔴 Cron: sync de catálogo falló', labels: ['sync-catalogos'], body: cuerpo});
            }

      - name: Cerrar el issue si se recuperó
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const {data: abiertas} = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'sync-catalogos', per_page: 100});
            for (const i of abiertas) {
              await github.rest.issues.createComment({...context.repo, issue_number: i.number,
                body: '✅ Sync de catálogo recuperado en ' + new Date().toISOString() + ' — cierro.'});
              await github.rest.issues.update({...context.repo, issue_number: i.number, state: 'closed'});
            }
